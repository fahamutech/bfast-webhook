<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c6149"><title>BFast Cloud · Console</title><link rel="icon" href="/site/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600&display=swap"><link rel="stylesheet" href="/admin/style.css"><script src="/admin/app.js" type="module"></script></head>
<body class="signed-out">
<header><a href="/admin">BFast <span>Cloud / Swarm manager</span></a><div id="who" class="who" hidden><img id="avatar" alt="" hidden><span id="who-text"></span><button id="logout" class="secondary">Sign out</button></div></header>
<p id="message" role="status" aria-live="polite"></p>
<main>
<section id="login" class="login-screen" hidden aria-labelledby="login-title">
  <canvas class="login-swarm" aria-hidden="true"></canvas>
  <div class="login-card">
    <a class="login-brand" href="/" aria-label="BFast Cloud website"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4"><path d="M32 10 51 21v22L32 54 13 43V21z"/></g><circle cx="32" cy="32" r="6" fill="currentColor"/></svg><span>BFast<b>Cloud</b></span></a>
    <p class="login-eyebrow"><span class="pulse"></span>Service console</p>
    <h1 id="login-title">Welcome back.</h1>
    <p class="login-lede">Sign in with the Google account that has access to your services.</p>
    <button id="google" class="google-btn" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Continue with Google</span></button>
    <p class="login-fine">No access yet? <a id="request-access" href="/">Request early access</a></p>
    <nav class="login-links" aria-label="More"><a href="/">← Website</a><a href="/docs/getting-started">Getting started</a><a href="/docs">Docs</a></nav>
  </div>
</section>
<section id="workspace" class="workspace" hidden>
<aside><nav id="admin-nav" class="nav" hidden><button data-view="swarm" class="nav-item">Swarm status</button><button data-view="users" class="nav-item">Users &amp; access</button><button data-view="create" class="nav-item accent">+ New service</button></nav>
<div class="toolbar"><h2>Services</h2><button id="refresh" class="secondary small" title="Refresh">↻</button></div><input id="filter" type="search" placeholder="Filter services" aria-label="Filter services"><div id="services" class="services"></div></aside>
<div class="detail"><button id="back" type="button" class="secondary back">← Services</button><div id="content" class="content"><p class="muted empty">Select a service to manage it.</p></div></div>
</section>
</main>
<template id="service-view">
<div class="toolbar wrap"><div class="heading"><h2 class="title"></h2><p class="muted subtitle"></p></div><div class="actions"></div></div>
<div class="tabs" role="tablist"><button data-tab="overview" role="tab">Overview</button><button data-tab="env" role="tab">Environment</button><button data-tab="secrets" role="tab">Secrets</button><button data-tab="deploy" role="tab">Auto-deploy</button><button data-tab="settings" role="tab">Settings</button><button data-tab="logs" role="tab">Logs</button></div>
<section data-panel="overview" class="panel"></section>
<section data-panel="env" class="panel" hidden><form class="env-form"><p class="muted">Values are sensitive and hidden until revealed. Choose Text, File or Base64. Removing a row deletes that variable when you save.</p><div class="envs"></div><div class="toolbar"><button type="button" class="secondary add-env">+ Add variable</button><button type="submit" class="save-env">Save &amp; redeploy</button></div></form></section>
<section data-panel="secrets" class="panel" hidden></section>
<section data-panel="deploy" class="panel" hidden></section>
<section data-panel="settings" class="panel" hidden></section>
<section data-panel="logs" class="panel" hidden><div class="toolbar"><label class="inline">Lines <select class="tail"><option>100</option><option selected>200</option><option>500</option><option>1000</option></select></label><label class="inline"><input type="checkbox" class="follow"> Auto-refresh (10s)</label><button type="button" class="secondary small load-logs">Load logs</button></div><pre class="logs" tabindex="0">Click “Load logs”.</pre></section>
</template>
<footer>BFast Cloud · Docker Swarm service management</footer>
</body></html>
